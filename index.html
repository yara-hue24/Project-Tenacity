<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tenacity · EVA planner for Mars</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0d0d'/%3E%3Crect x='5' y='19' width='7' height='7' fill='%23f2f2f2'/%3E%3Cpath d='M12 22.5C19 22.5 16 9 24.5 9' fill='none' stroke='%23ff5cf4' stroke-width='2.4'/%3E%3Ccircle cx='24.5' cy='9' r='3' fill='none' stroke='%23f2f2f2' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preload" href="vendor/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="vendor/fonts/dm-mono-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Docked panes, edge to edge: title and status on top, plan on the left, map in the middle,
       simulation and rules on the right, clocks under the map, sequence and console at the bottom. -->
  <div id="app">
    <header id="titlebar" class="bar">
      <div><h1>TENACITY EVA PLANNER</h1></div>
      <div><label class="k" for="trip">Plan</label><select id="trip" aria-label="Choose a plan"></select></div>
      <div><span class="k">Mode</span><div class="seg" id="mode" role="group" aria-label="Mode"></div></div>
      <div id="verdict" class="grow" role="status" aria-live="polite"></div>
      <div id="alerts" aria-label="Alert counts"></div>
      <div><button class="btn pl" data-act="cuff">Cuff card</button></div>
    </header>

    <div id="mid">
      <aside class="dock l" aria-label="Activity list">
        <div class="hd">Activity list <small id="act-sum"></small></div>
        <div id="activity"></div>
        <div class="hd">Cursor</div>
        <div id="cursor"></div>
      </aside>

      <main id="mapwrap">
        <div id="preset" role="group" aria-label="Layer preset"></div>
        <div id="map" aria-label="Map of the walk"></div>
        <div id="north" aria-hidden="true">N ↑</div>
        <details id="legend" open><summary>Legend</summary><div class="g" id="legend-body"></div></details>
      </main>

      <aside class="dock r" aria-label="Simulation, rules and probe">
        <div id="sim"></div>
        <div id="rules"></div>
        <div id="probe"></div>
      </aside>
    </div>

    <div id="clock" class="bar" aria-label="Clocks and playback"></div>

    <div id="bot">
      <section>
        <nav class="tabs" id="tabs" role="tablist"></nav>
        <div id="tabbody"></div>
      </section>
      <section id="con" aria-label="Console">
        <nav class="tabs"><button aria-selected="true">Console</button></nav>
        <div id="conbody" role="log"></div>
      </section>
    </div>

    <footer id="status"><span id="status-text"></span><span>NASA Space Apps Challenge 2026</span></footer>
  </div>

  <div id="cuff-sheet" hidden>
    <div class="cuff-actions">
      <button id="cuff-print" class="btn">Print</button>
      <button id="cuff-close" class="btn pl">Close</button>
    </div>
    <article id="cuff"></article>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
