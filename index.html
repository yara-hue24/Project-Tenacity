<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tenacity · EVA planner for Mars</title>
  <link rel="icon" href="icons/tenacity.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#161616">
  <link rel="preload" href="vendor/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Shown until the plan, the map and the first simulation are on screen. -->
  <div id="loading" role="status" aria-live="polite">
    <div class="load-box">
      <h1><svg class="load-word" viewBox="-4 0 168 56" role="img" aria-label="Tenacity"><path pathLength="1" style="--t:0.00s;--d:0.21s" d="M1 12Q6.5 5 12 11T23 10"/><path pathLength="1" style="--t:0.13s;--d:0.18s" d="M12 11V40"/><path pathLength="1" style="--t:0.27s;--d:0.24s" d="M28 32H44A8 8 0 1 0 41.66 37.66"/><path pathLength="1" style="--t:0.45s;--d:0.10s" d="M51 24V40"/><path pathLength="1" style="--t:0.50s;--d:0.18s" d="M51 32A8 8 0 0 1 67 32V40"/><path pathLength="1" style="--t:0.63s;--d:0.21s" d="M90 32A8 8 0 1 0 74 32A8 8 0 1 0 90 32"/><path pathLength="1" style="--t:0.77s;--d:0.10s" d="M90 24V40"/><path pathLength="1" style="--t:0.84s;--d:0.18s" d="M110.66 26.34A8 8 0 1 0 110.66 37.66"/><path pathLength="1" style="--t:0.97s;--d:0.10s" d="M118 24V40"/><path pathLength="1" style="--t:1.04s;--d:0.15s" d="M129 14V35Q129 40 134.5 40"/><path pathLength="1" style="--t:1.15s;--d:0.08s" d="M124 24H135"/><path pathLength="1" style="--t:1.20s;--d:0.10s" d="M142 24L150 40"/><path pathLength="1" style="--t:1.26s;--d:0.20s" d="M158 24L148.6 44.5Q146.6 49 142 48.5"/><path pathLength="1" style="--t:1.43s;--d:0.06s" d="M118 16.5v.01"/></svg></h1>
      <p class="load-sub">EVA planner for Mars · Gale Crater</p>
      <div class="load-bar"><i id="load-fill"></i></div>
      <ul id="load-steps"></ul>
      <p class="load-foot">NASA Space Apps Challenge 2026 · not affiliated with NASA</p>
    </div>
  </div>

  <!-- Docked panes: menu and toolbar, plan status, then plan | map | simulation, clocks, and the sequence dock.
       Every dock edge can be dragged; panels can be collapsed or hidden from the Windows menu. -->
  <div id="app">
    <div id="menubar">
      <span class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 10.5Q10.5 5 16 9.5T27 8.5M16 9.5V26" fill="none" stroke="#f2f2f2" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Tenacity</b></span>
      <nav id="menus" aria-label="Menus"></nav>
      <span class="grow"></span>
      <div id="toolbar" role="toolbar" aria-label="Tools"></div>
    </div>

    <header id="titlebar" class="bar">
      <div data-tour="plan"><label class="k" for="trip">Plan</label><select id="trip" aria-label="Choose a plan"></select></div>
      <div data-tour="mode"><span class="k">Mode</span><div class="seg" id="mode" role="group" aria-label="Mode"></div></div>
      <div id="verdict" class="grow" role="status" aria-live="polite" data-tour="verdict"></div>
      <div id="alerts" aria-label="Alert counts"></div>
    </header>

    <div id="work">
      <aside class="dock l" id="dock-l" aria-label="Plan">
        <section class="panel grow" data-panel="activity">
          <div class="hd"><button class="tw" data-act="collapse" data-id="activity" aria-label="Collapse or expand"></button><span class="ttl">Activity list</span><small id="act-sum"></small><span class="hd-tools"><button class="ib" data-info="activity" aria-label="About this panel">i</button><button class="ib" data-act="hidepanel" data-id="activity" aria-label="Hide panel">×</button></span></div>
          <div class="bd" id="activity"></div>
        </section>
        <section class="panel" data-panel="locator">
          <div class="hd"><button class="tw" data-act="collapse" data-id="locator" aria-label="Collapse or expand"></button><span class="ttl">Where on Mars</span><span class="hd-tools"><button class="ib" data-info="locator" aria-label="About this panel">i</button><button class="ib" data-act="hidepanel" data-id="locator" aria-label="Hide panel">×</button></span></div>
          <div class="bd"><div id="locator"></div><div id="cursor"></div></div>
        </section>
      </aside>
      <div class="split v" data-split="left" role="separator" aria-orientation="vertical" title="Drag to resize"></div>

      <main id="mapwrap" data-tour="map">
        <div id="preset" role="group" aria-label="Layer preset" data-tour="preset"></div>
        <div id="map" aria-label="Map of the walk"></div>
        <div id="crumb" aria-live="polite"></div>
        <details id="legend"><summary>Legend</summary><div class="g" id="legend-body"></div></details>
        <div id="viz" hidden></div>
      </main>

      <div class="split v" data-split="right" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
      <aside class="dock r" id="dock-r" aria-label="Simulation, rules and probe">
        <section class="panel" data-panel="sim">
          <div class="hd"><button class="tw" data-act="collapse" data-id="sim" aria-label="Collapse or expand"></button><span class="ttl">Simulation</span><small id="sim-sum"></small><span class="hd-tools"><button class="ib" data-info="sim" aria-label="About this panel">i</button><button class="ib" data-act="hidepanel" data-id="sim" aria-label="Hide panel">×</button></span></div>
          <div class="bd" id="sim"></div>
        </section>
        <section class="panel" data-panel="rules">
          <div class="hd"><button class="tw" data-act="collapse" data-id="rules" aria-label="Collapse or expand"></button><span class="ttl">Flight rules</span><small id="rules-sum"></small><span class="hd-tools"><button class="ib" data-info="rules" aria-label="About this panel">i</button><button class="ib" data-act="hidepanel" data-id="rules" aria-label="Hide panel">×</button></span></div>
          <div class="bd" id="rules"></div>
        </section>
        <section class="panel grow" data-panel="probe">
          <div class="hd"><button class="tw" data-act="collapse" data-id="probe" aria-label="Collapse or expand"></button><span class="ttl">Probe</span><small id="probe-sum"></small><span class="hd-tools"><button class="ib" data-info="probe" aria-label="About this panel">i</button><button class="ib" data-act="hidepanel" data-id="probe" aria-label="Hide panel">×</button></span></div>
          <div class="bd" id="probe"></div>
        </section>
      </aside>
    </div>

    <div id="clock" class="bar" aria-label="Clocks and playback" data-tour="clock"></div>
    <div class="split h" data-split="bottom" role="separator" aria-orientation="horizontal" title="Drag to resize"></div>

    <div id="bot" data-panel="bottom">
      <section>
        <nav class="tabs" id="tabs" role="tablist"></nav>
        <div id="tabbody"></div>
      </section>
      <section id="con" aria-label="Console" data-panel="console">
        <nav class="tabs"><span class="tabttl">Console</span><span class="grow"></span><button class="ib" data-info="console" aria-label="About the console">i</button></nav>
        <div id="conbody" role="log"></div>
      </section>
    </div>

    <footer id="status"><span id="status-text"></span><span>NASA Space Apps Challenge 2026</span></footer>
  </div>

  <div id="cuff-sheet" hidden>
    <div class="cuff-actions">
      <button id="cuff-print" class="btn primary">Print</button>
      <button id="cuff-close" class="btn">Close</button>
    </div>
    <article id="cuff"></article>
  </div>

  <!-- Overlays made by js/ui.js: menus, dialogs, info pop-ups, search, and the guided tour. -->
  <div id="overlays"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
